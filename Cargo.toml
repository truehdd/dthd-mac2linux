[package]
name = "dthd-mac2linux"
version = "0.1.1"
edition = "2021"
rust-version = "1.97"
description = "Build dee_dthd_encoder for Linux from its macOS x86-64 payload"
authors = ["Rainbaby"]
license = "Apache-2.0"
publish = false

[workspace]
members = ["crates/darwin-abi"]
resolver = "2"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1

[[bin]]
name = "dthd-mac2linux"
path = "src/main.rs"
