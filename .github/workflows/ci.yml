name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - run: sudo apt-get update && sudo apt-get install -y rpm2cpio cpio
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: |
          cargo run --locked --release -- fetch-sources inputs/sources
          cargo run --locked --release -- build-builder --sources inputs/sources
          tar -C dist -czf dthd-mac2linux-linux-x86_64.tar.gz dthd-mac2linux
      - uses: actions/upload-artifact@v7
        with:
          name: dthd-mac2linux-linux-x86_64
          path: dthd-mac2linux-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dthd-mac2linux-linux-x86_64
      - run: |
          gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes -- \
            "$RELEASE_TAG" dthd-mac2linux-linux-x86_64.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
